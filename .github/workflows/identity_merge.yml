name: Identity Merge (manual)

# One-off maintenance: merge duplicate swimmer identities.
# Default mode is a DRY RUN that only writes merge_plan.json as an
# artifact. Set execute=true only after reviewing the plan
# (see docs/data_quality_repair_plan.md).

on:
  workflow_dispatch:
    inputs:
      execute:
        description: 'Actually merge (false = dry-run plan only)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run identity merge
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ "${{ inputs.execute }}" = "true" ]; then
            python backend/merge_identities.py --execute --out merge_out
          else
            python backend/merge_identities.py --out merge_out
          fi

      - name: Upload plan / audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: identity-merge-output
          path: merge_out/
          if-no-files-found: warn
